services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Gap 4 fix: DOMAIN must be present so Caddy issues a real TLS cert,
    # not fall back to localhost. Fails fast if .env is missing DOMAIN.
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN=api.yourdomain.com in /opt/app/.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    # IMAGE_TAG must be a full repo@sha256:... digest — set by the deploy script.
    # Fails fast if not provided.
    image: ${IMAGE_TAG:?Set IMAGE_TAG to an immutable ECR digest before starting}
    restart: unless-stopped
    env_file:
      - .env
    # expose (not ports) keeps port 3000 inside the Docker network only.
    # The deploy script MUST NOT use curl 127.0.0.1:3000 from the host —
    # use 'docker compose exec' or 'docker compose up --wait' instead (Gap 3).
    expose:
      - '3000'
    depends_on:
      # Gap 5 fix: wait for Redis to be ready before starting the API,
      # so Bull queue initialisation does not fail on connection refused.
      redis:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: '${AWS_REGION:-us-east-1}'
        awslogs-group: '/aws/ec2/seller-portal-backend'
        awslogs-stream: 'api-service'
        awslogs-create-group: 'true'
    healthcheck:
      # Runs INSIDE the container — works with expose-only port (Gap 3).
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password is interpolated at runtime from .env; never hard-code it here.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    # Gap 5 fix: authenticated PING so the api service waits for Redis readiness.
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  redis_data:
